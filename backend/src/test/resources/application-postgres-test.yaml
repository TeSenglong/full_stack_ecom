spring:
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///ecomdb
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: false

app:
  security:
    jwt:
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      issuer: ecom-backend-postgres-test
      audience: ecom-api
      access-token-ttl: PT15M
    rate-limit:
      enabled: false
    checkout-rate-limit:
      enabled: false
