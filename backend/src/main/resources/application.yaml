spring:
  application:
    name: backend

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: ${AVATAR_MAX_FILE_SIZE:5MB}
      max-request-size: ${AVATAR_MAX_REQUEST_SIZE:6MB}

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:ecom-backend}
      audience: ${JWT_AUDIENCE:ecom-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}

  storage:
    avatar:
      enabled: ${AVATAR_STORAGE_ENABLED:false}
      endpoint: ${SUPABASE_S3_ENDPOINT:}
      region: ${SUPABASE_S3_REGION:}
      access-key: ${SUPABASE_S3_ACCESS_KEY:}
      secret-key: ${SUPABASE_S3_SECRET_KEY:}
      bucket: ${SUPABASE_AVATAR_BUCKET:profile-images}
      public-base-url: ${SUPABASE_STORAGE_PUBLIC_URL:}
      max-file-size: ${AVATAR_MAX_FILE_SIZE:5MB}
    product-image:
      enabled: ${PRODUCT_IMAGE_STORAGE_ENABLED:false}
      endpoint: ${SUPABASE_S3_ENDPOINT:}
      region: ${SUPABASE_S3_REGION:}
      access-key: ${SUPABASE_S3_ACCESS_KEY:}
      secret-key: ${SUPABASE_S3_SECRET_KEY:}
      bucket: ${SUPABASE_PRODUCT_IMAGE_BUCKET:product-images}
      public-base-url: ${SUPABASE_STORAGE_PUBLIC_URL:}
      max-file-size: ${PRODUCT_IMAGE_MAX_FILE_SIZE:5MB}
