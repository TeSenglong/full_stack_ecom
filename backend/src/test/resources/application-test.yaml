spring:
  datasource:
    url: jdbc:h2:mem:ecomdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false

app:
  security:
    jwt:
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      issuer: ecom-backend-test
      audience: ecom-api
      access-token-ttl: PT15M
    rate-limit:
      enabled: false
    checkout-rate-limit:
      enabled: false
